services:
  backend:
    build: ./backend
    environment:
      DATABASE_URL: sqlite:////data/inventory.db
      SEED_DEMO_DATA: "true"
    volumes:
      - inventory-data:/data
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 10s
      timeout: 3s
      retries: 5

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports:
      - "8080:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  inventory-data:
